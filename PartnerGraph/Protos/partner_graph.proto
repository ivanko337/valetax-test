syntax = "proto3";

option csharp_namespace = "PartnerGraph.Grpc";

package partnergraph.v1;

service PartnerGraphApi {
  rpc GetUplinePartners (GetUplinePartnersRequest) returns (GetUplinePartnersResponse);
}

message GetUplinePartnersRequest {
  string external_user_id = 1;
}

message GetUplinePartnersResponse {
  repeated UplinePartner partners = 1;
}

message UplinePartner {
  string external_user_id = 1;
  int32 level = 2;
}
